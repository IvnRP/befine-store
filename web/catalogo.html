<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Catálogo · Befine Store</title>
  <meta name="description" content="Catálogo completo de Befine: recargas, bidones, dispensadores y packs de agua purificada a domicilio.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Fraunces:ital,opsz,wght@1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/catalogo.css">
</head>
<body>
<script>try{document.body.classList.toggle('tema-claro',(localStorage.getItem('befine_tema')||'claro')==='claro');}catch(e){document.body.classList.add('tema-claro');}</script>

<canvas id="water" aria-hidden="true"></canvas>
<div class="bg-veil"></div>
<div class="depth" id="depth" aria-hidden="true"></div>
<div class="bubbles" id="bubbles" aria-hidden="true"></div>
<div class="cur-ring" id="curRing" aria-hidden="true"></div>
<div class="cur-dot" id="curDot" aria-hidden="true"></div>

<!-- BARRA SUPERIOR (la inyecta js/shell.js — mismo formato en todas las páginas) -->
<div id="app-header"></div>

<div class="app">
  <div class="wrap">
    <section class="cat-head">
      <h1>Catálogo</h1>
      <p>Todo el agua de Befine en un solo lugar. Filtra y encuentra lo tuyo rápido.</p>
    </section>

    <!-- Barra de herramientas: filtros + búsqueda + orden -->
    <div class="toolbar">
      <div class="filters" id="filtros"><!-- lo llena catalogo.js --></div>
      <span class="spacer"></span>
      <div class="search search-lg">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="catSearch" placeholder="Buscar en el catálogo…" aria-label="Buscar en el catálogo">
      </div>
      <select id="catOrden" aria-label="Ordenar">
        <option value="relevancia">Relevancia</option>
        <option value="precio_asc">Precio: menor a mayor</option>
        <option value="precio_desc">Precio: mayor a menor</option>
      </select>
    </div>
    <!-- Grilla de productos (la llena catalogo.js con cards.js) -->
    <div class="grid" id="grid"></div>
  </div>

  <!-- PIE (lo inyecta js/shell.js — mismo formato en todas las páginas) -->
  <div id="app-footer"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/shell.js"></script>
<script src="js/transitions.js"></script>
<script src="js/scenes.js"></script>
<script src="js/ui.js"></script>
<button class="sound-btn" id="soundBtn" aria-label="Silenciar"></button>
<script src="js/cards.js"></script>
<script src="js/water.js"></script>
<script src="js/bands.js"></script>
<script src="js/fx.js"></script>
<script src="js/theme.js"></script>
<script src="js/perf.js"></script>
<script src="js/catalogo.js"></script>
</body>
</html>

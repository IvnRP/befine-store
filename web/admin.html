<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Panel de administración · Befine Store</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="page-admin">

<!-- ============ Barra superior ============ -->
<header class="pn-top">
  <a class="pn-brand" href="admin.html"><img src="assets/logo-befine.png" alt="Befine"><span>Panel</span></a>
  <span class="pn-spacer"></span>
  <div class="pn-user" id="pnUser" hidden>
    <span class="pn-avatar" id="pnAvatar">B</span>
    <span class="pn-who"><b id="pnNombre"></b><small id="pnRol"></small></span>
  </div>
  <a class="pn-btn ghost" href="index.html">Ver tienda</a>
  <button class="pn-btn ghost" id="pnSalir" type="button" hidden>Salir</button>
</header>

<div class="pn-shell">
  <!-- Navegación por secciones (solo las que el rol puede ver) -->
  <nav class="pn-nav" id="pnNav" aria-label="Secciones del panel" hidden></nav>

  <main class="pn-main" id="pnMain">
    <!-- Estados de acceso -->
    <div class="pn-estado" id="vCarga"><span class="pn-spin"></span> Cargando panel…</div>

    <section class="pn-estado pn-card" id="vSinSesion" hidden>
      <h1>Panel de administración</h1>
      <p>Ingresa con tu cuenta de Befine para continuar.</p>
      <a class="pn-btn" href="cuenta.html?volver=admin.html">Ingresar</a>
    </section>

    <section class="pn-estado pn-card" id="vSinPermiso" hidden>
      <h1>Sin acceso al panel</h1>
      <p>Tu cuenta no tiene permisos de administración. Si trabajas en Befine, pide al administrador que te asigne un rol.</p>
      <a class="pn-btn ghost" href="index.html">Volver a la tienda</a>
    </section>

    <!-- Secciones: admin.js las llena según los permisos -->
    <section class="pn-sec" id="sec-pedidos" hidden></section>
    <section class="pn-sec" id="sec-catalogo" hidden></section>
    <section class="pn-sec" id="sec-inventario" hidden></section>
    <section class="pn-sec" id="sec-cupones" hidden></section>
    <section class="pn-sec" id="sec-reparto" hidden></section>
    <section class="pn-sec" id="sec-clientes" hidden></section>
    <section class="pn-sec" id="sec-equipo" hidden></section>
  </main>
</div>

<!-- Panel lateral (detalle) y modal (formularios) reutilizables -->
<aside class="pn-drawer" id="pnDrawer" aria-hidden="true" tabindex="-1"><div class="pn-drawer-in" id="pnDrawerIn"></div></aside>
<div class="pn-velo" id="pnVelo" hidden></div>
<div class="pn-modal" id="pnModal" role="dialog" aria-modal="true" hidden><div class="pn-modal-in" id="pnModalIn"></div></div>
<div class="pn-toast" id="pnToast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/data.js"></script>
<script src="js/admin-logic.js"></script>
<script src="js/admin-data.js"></script>
<script src="js/admin.js"></script>
<script src="js/admin-pedidos.js"></script>
<script src="js/admin-catalogo.js"></script>
<script src="js/admin-inventario.js"></script>
<script src="js/admin-cupones.js"></script>
<script src="js/admin-reparto.js"></script>
<script src="js/admin-equipo.js"></script>
<script src="js/admin-clientes.js"></script>
</body>
</html>

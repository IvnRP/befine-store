# Befine Store — configuración de nginx dentro del contenedor

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión: el sitio pesa menos al viajar por la red (RNF de rendimiento)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cabeceras de seguridad (las mismas de deploy/_headers; auditoría 25-nov, headers del hosting)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), serial=(), hid=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=(), browsing-topics=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-VKFCEqpoX4BPvGCl0v+sjDkiipxcbsyFw1XBjW+L4fk=' 'sha256-S+VENnpKhoiyXShSAHERoorPLZVNo1fHsHX6KxASdT4=' https://static.cloudflareinsights.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://tbnevbvvwwzpnowxqyps.supabase.co https://lh3.googleusercontent.com; connect-src 'self' https://tbnevbvvwwzpnowxqyps.supabase.co wss://tbnevbvvwwzpnowxqyps.supabase.co https://cloudflareinsights.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

    # Imágenes: se guardan en caché del navegador 30 días
    location ~* \.(webp|png|jpg|jpeg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # CSS y JS: el navegador SIEMPRE pregunta si cambiaron (respuesta 304 si no, casi sin costo).
    # Evita que un cliente quede con código antiguo después de publicar una versión nueva
    # (por ejemplo, un checkout sin la casilla de aceptación frente a un servidor que la exige).
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Ficha con dirección amigable /productos/<slug> (igual que deploy/_redirects en Cloudflare)
    location /productos/ {
        try_files /producto.html =404;
    }

    # Páginas: permite /catalogo además de /catalogo.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # El código de las Edge Functions no se publica
    location ^~ /supabase/ {
        return 404;
    }
}

# Befine Store — configuración de nginx dentro del contenedor

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión: el sitio pesa menos al viajar por la red (RNF de rendimiento)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cabeceras de seguridad básicas
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Imágenes: se guardan en caché del navegador 30 días
    location ~* \.(webp|png|jpg|jpeg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # CSS y JS: caché corta para que los cambios se vean pronto
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Páginas: permite /catalogo además de /catalogo.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # El código de las Edge Functions no se publica
    location ^~ /supabase/ {
        return 404;
    }
}

name: Error (bug)
description: Algo no funciona como debería
title: "Bug · "
labels: ["tipo:bug"]
body:
  - type: textarea
    id: que
    attributes:
      label: ¿Qué pasa?
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: "1. Ir a ...  2. Hacer clic en ...  3. Ver el error"
    validations:
      required: true
  - type: input
    id: donde
    attributes:
      label: Página, dispositivo y modo
      placeholder: "checkout.html · celular · modo noche"
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado